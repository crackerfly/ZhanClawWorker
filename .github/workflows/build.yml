name: build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify payload files
        shell: pwsh
        run: |
          $agent = 'runtime/p2p-agent.exe'
          if (-not (Test-Path $agent)) {
            Write-Error "缺少 $agent。请把发行包中的 p2p-agent.exe 提交到仓库 runtime 目录。"
            exit 1
          }
          $size = (Get-Item $agent).Length
          Write-Host "p2p-agent.exe: $([math]::Round($size/1MB,2)) MB"

          if (Test-Path 'runtime/swarm.key') {
            Write-Host 'swarm.key: 已内置（安装向导免选）'
          } else {
            Write-Warning 'runtime/swarm.key 缺失：安装向导将要求用户手动选择文件。'
          }

      - name: Restore
        run: dotnet restore src/ZhanClawControl/ZhanClawControl.csproj

      - name: Build
        run: >
          dotnet build src/ZhanClawControl/ZhanClawControl.csproj
          --configuration Release
          --no-restore
          -warnaserror:CS0618,CS0619

      - name: Publish (smoke)
        run: >
          dotnet publish src/ZhanClawControl/ZhanClawControl.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/publish

      - name: Report output size
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish -File |
            Sort-Object Length -Descending |
            Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize
